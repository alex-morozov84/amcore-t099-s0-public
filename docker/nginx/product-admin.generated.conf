# Generated from product-admin placement. Regenerate with scripts/render-product-admin-edge.mjs.
# Include inside the dedicated TLS server block; web stays private.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Amcore-Web-Frontend "";
proxy_set_header X-Amcore-Web-Placement "";
proxy_set_header X-Amcore-Web-Context-Key "";
location ~ "^/staff(?:/|$)" { return 404; }
location ~ ^/api/console(?:/|$) { return 404; }
location ~ ^/api/auth/(?:login|register|logout|forgot-password|reset-password|verify-email|resend-verification|oauth|mfa)(?:/|$) { return 404; }
location = / { return 308 /organizations; }
location ~ ^/(?:api|_next)/ { proxy_pass http://web:3000; }
location ~ "^(?:/icons/README\.md|/icons/icon-192x192\.png|/icons/icon-512x512-maskable\.png|/icons/icon-512x512\.png|/logo-dark\.png|/logo-light\.png|/mockServiceWorker\.js|/sw\.js|/favicon\.ico|/manifest\.webmanifest|/robots\.txt|/sitemap\.xml)$" { proxy_pass http://web:3000; }
location ~ ^(.+[^/])/$ { return 308 $1$is_args$args; }
location ~ "^((?:/auth/linked|/forgot-password|/invite/accept|/invite/bootstrap/[^/]+|/invite/flow/[^/]+|/invite/unusable|/login|/mfa|/resend-verification|/reset-password|/sign-in-again|/verify-email|/account/security|/organizations/[^/]+/invites|/organizations/[^/]+/members|/organizations/[^/]+|/organizations/[^/]+/roles/[^/]+|/organizations/[^/]+/roles|/organizations||/settings/api-keys|/settings/sessions|/auth/callback))$" {
  rewrite "^((?:/auth/linked|/forgot-password|/invite/accept|/invite/bootstrap/[^/]+|/invite/flow/[^/]+|/invite/unusable|/login|/mfa|/resend-verification|/reset-password|/sign-in-again|/verify-email|/account/security|/organizations/[^/]+/invites|/organizations/[^/]+/members|/organizations/[^/]+|/organizations/[^/]+/roles/[^/]+|/organizations/[^/]+/roles|/organizations||/settings/api-keys|/settings/sessions|/auth/callback))$" /staff$1 break;
  proxy_pass http://web:3000;
}
location / { return 404; }
